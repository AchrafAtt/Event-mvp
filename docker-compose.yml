services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_started
    ports:
      - '${APP_PORT:-80}:80'
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: ./docker/app/Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: '${APP_ENV:-production}'
      APP_DEBUG: '${APP_DEBUG:-false}'
      APP_URL: '${APP_URL:-http://localhost}'
      DB_CONNECTION: '${DB_CONNECTION:-pgsql}'
      DB_HOST: '${DB_HOST:-postgres}'
      DB_PORT: '${DB_PORT:-5432}'
      DB_DATABASE: '${DB_DATABASE:-event_gh}'
      DB_USERNAME: '${DB_USERNAME:-event_gh}'
      DB_PASSWORD: '${DB_PASSWORD:-change-me}'
      QR_TICKET_SERVICE_URL: '${QR_TICKET_SERVICE_URL:-http://qr-ticket:8000}'
      ANALYTICS_SERVICE_URL: '${ANALYTICS_SERVICE_URL:-http://analytics:8000}'
    depends_on:
      postgres:
        condition: service_healthy
      qr-ticket:
        condition: service_started
      analytics:
        condition: service_started
    volumes:
      - ./:/var/www
      - laravel_storage:/var/www/storage
      - laravel_cache:/var/www/bootstrap/cache
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: ./docker/app/Dockerfile
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=120
    env_file:
      - .env
    environment:
      APP_ENV: '${APP_ENV:-production}'
      APP_DEBUG: '${APP_DEBUG:-false}'
      DB_CONNECTION: '${DB_CONNECTION:-pgsql}'
      DB_HOST: '${DB_HOST:-postgres}'
      DB_PORT: '${DB_PORT:-5432}'
      DB_DATABASE: '${DB_DATABASE:-event_gh}'
      DB_USERNAME: '${DB_USERNAME:-event_gh}'
      DB_PASSWORD: '${DB_PASSWORD:-change-me}'
      QR_TICKET_SERVICE_URL: '${QR_TICKET_SERVICE_URL:-http://qr-ticket:8000}'
      ANALYTICS_SERVICE_URL: '${ANALYTICS_SERVICE_URL:-http://analytics:8000}'
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      - ./:/var/www
      - laravel_storage:/var/www/storage
      - laravel_cache:/var/www/bootstrap/cache
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: ./docker/app/Dockerfile
    command: php artisan schedule:work
    env_file:
      - .env
    environment:
      APP_ENV: '${APP_ENV:-production}'
      APP_DEBUG: '${APP_DEBUG:-false}'
      DB_CONNECTION: '${DB_CONNECTION:-pgsql}'
      DB_HOST: '${DB_HOST:-postgres}'
      DB_PORT: '${DB_PORT:-5432}'
      DB_DATABASE: '${DB_DATABASE:-event_gh}'
      DB_USERNAME: '${DB_USERNAME:-event_gh}'
      DB_PASSWORD: '${DB_PASSWORD:-change-me}'
      QR_TICKET_SERVICE_URL: '${QR_TICKET_SERVICE_URL:-http://qr-ticket:8000}'
      ANALYTICS_SERVICE_URL: '${ANALYTICS_SERVICE_URL:-http://analytics:8000}'
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      - ./:/var/www
      - laravel_storage:/var/www/storage
      - laravel_cache:/var/www/bootstrap/cache
    restart: unless-stopped

  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    ports:
      - '${DB_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: '${DB_DATABASE:-event_gh}'
      POSTGRES_USER: '${DB_USERNAME:-event_gh}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-change-me}'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-event_gh} -d ${DB_DATABASE:-event_gh}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qr-ticket:
    build:
      context: ./services/qr-ticket
      dockerfile: Dockerfile
    ports:
      - '${QR_TICKET_PORT:-8090}:8000'
    environment:
      API_KEY: '${QR_TICKET_SERVICE_KEY:-dev-qr-ticket-key-change-me}'
    restart: unless-stopped

  analytics:
    build:
      context: ./services/analytics
      dockerfile: Dockerfile
    ports:
      - '${ANALYTICS_SERVICE_PORT:-8091}:8000'
    environment:
      API_KEY: '${ANALYTICS_SERVICE_KEY:-dev-analytics-key-change-me}'
    restart: unless-stopped

volumes:
  postgres_data:
  laravel_storage:
  laravel_cache:
